<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigBang - Consulta de Puntos</title>
    <style>
        /* ===============================
           ESTILOS GENERALES (CSS)
           =============================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .tarjeta {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #1e272e;
            margin-bottom: 0.2rem;
            font-size: 28px;
        }

        p {
            color: #808e9b;
            margin-bottom: 1.5rem;
            font-size: 14px;
        }

        .input-cliente {
            width: 100%;
            padding: 14px;
            margin-bottom: 1.5rem;
            border: 2px solid #d2dae2;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-cliente:focus {
            border-color: #ff3f34; /* Color temático BigBang */
        }

        /* ===============================
           CONTENEDOR DE BOTONES
           =============================== */
        .botones-container {
            display: flex;
            gap: 10px;
        }

        .btn-consulta {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primario {
            background-color: #ff3f34;
        }
        
        .btn-primario:hover { background-color: #ff5e57; }

        .btn-secundario {
            background-color: #0fb9b1;
        }

        .btn-secundario:hover { background-color: #2bcbba; }

        .btn-consulta:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background-color: #808e9b;
        }

        /* ===============================
           RESULTADO Y SPINNER
           =============================== */
        .caja-resultado {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            background-color: #ffd32a; /* Fondo amarillo para resaltar */
            color: #1e272e;
            font-size: 18px;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 18px;
            height: 18px;
            animation: girar 1s linear infinite;
            display: none;
        }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===============================
           VERSIÓN CELULAR (MEDIA QUERY)
           =============================== */
        @media (max-width: 768px) {
            .botones-container {
                flex-direction: column;
            }
            .btn-consulta {
                width: 100%;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h1>BigBang</h1>
        <p>Una Teoría Deliciosa - Portal de Fidelidad</p>

        <input type="text" id="identificadorCliente" class="input-cliente" placeholder="Tu número de Cédula o Teléfono">

        <div class="botones-container">
            <button id="botonConsultar" class="btn-consulta btn-primario">
                <span class="texto-boton">Consultar</span>
                <div class="spinner"></div>
            </button>
            
            <button id="botonRefrescar" class="btn-consulta btn-secundario">
                <span class="texto-boton">Refrescar</span>
                <div class="spinner"></div>
            </button>
        </div>

        <div id="resultadoPuntos" class="caja-resultado">
            </div>
    </div>

    <script>
        /* ===============================
           LÓGICA FUNCIONAL (JAVASCRIPT)
           =============================== */
        const btnConsultar = document.getElementById('botonConsultar');
        const btnRefrescar = document.getElementById('botonRefrescar');
        const inputCliente = document.getElementById('identificadorCliente');
        const cajaResultado = document.getElementById('resultadoPuntos');

        // Función única ejecutada por Consultar y Refrescar
        async function procesarConsulta() {
            const idCliente = inputCliente.value.trim();

            if (!idCliente) {
                alert("Por favor, ingresa tu número para consultar los puntos.");
                return;
            }

            // Bloquear interfaz y mostrar animación de carga
            activarCarga(btnConsultar, true);
            activarCarga(btnRefrescar, true);
            cajaResultado.style.display = 'none'; 

            try {
                // URL de tu webhook en n8n pasando el ID como parámetro de consulta
                const urlWebhook = `https://n8n-stanlyrodriguez-vps.duckdns.org/webhook/consulta-puntos?id=${encodeURIComponent(idCliente)}`;
                
                const respuesta = await fetch(urlWebhook, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!respuesta.ok) {
                    throw new Error("Error al conectar con el servidor de n8n");
                }

                const datos = await respuesta.json();
                
                // Extrae la propiedad 'puntos' del JSON que retorna tu flujo de n8n
                // Si tu JSON usa otro nombre (ej. 'total_puntos'), cámbialo aquí
                const puntosRecibidos = datos.puntos !== undefined ? datos.puntos : 0;

                // Actualizar e inyectar el resultado en la interfaz
                cajaResultado.innerHTML = `🎉 Tienes <br><span style="font-size: 28px; color: #ff3f34;">${puntosRecibidos} puntos</span><br> acumulados.`;
                cajaResultado.style.display = 'block';

            } catch (error) {
                alert("Hubo un problema al consultar tus puntos. Por favor, intenta de nuevo.");
                console.error("Error en la petición:", error);
            } finally {
                // Desbloquear botones y ocultar animación de carga
                activarCarga(btnConsultar, false);
                activarCarga(btnRefrescar, false);
            }
        }

        // Control visual del estado de carga dentro de los botones
        function activarCarga(boton, cargando) {
            const texto = boton.querySelector('.texto-boton');
            const spinner = boton.querySelector('.spinner');
            
            if (cargando) {
                boton.disabled = true;
                texto.style.display = 'none';
                spinner.style.display = 'block';
            } else {
                boton.disabled = false;
                texto.style.display = 'block';
                spinner.style.none = 'none';
                spinner.style.display = 'none';
            }
        }

        // Asignación del mismo evento y flujo a ambos botones
        btnConsultar.addEventListener('click', procesarConsulta);
        btnRefrescar.addEventListener('click', procesarConsulta);

    </script>
</body>
</html>
 
 
</script>
</body>
</html>
